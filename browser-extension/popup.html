<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 320px; font-family: system-ui, sans-serif; background: #0a0a0a; color: #ececec; margin: 0; padding: 14px; font-size: 13px; }
    h1 { font-size: 13px; margin: 0 0 4px; color: #fff; }
    .sub { color: #8e8e8e; font-size: 11px; margin-bottom: 10px; }
    .row { margin-bottom: 8px; }
    label { display: block; font-size: 11px; color: #8e8e8e; margin-bottom: 3px; }
    input { width: 100%; box-sizing: border-box; background: #171717; border: 1px solid #2f2f2f; border-radius: 8px; color: #fff; padding: 6px 8px; font-size: 12px; }
    button { width: 100%; background: #fff; color: #000; border: 0; border-radius: 8px; padding: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .5; }
    #status { margin-top: 10px; font-size: 11px; min-height: 28px; white-space: pre-wrap; }
    .ok { color: #34d399; } .err { color: #f87171; } .meta { color: #8e8e8e; }
  </style>
</head>
<body>
  <h1>Save to Local Workbench</h1>
  <div class="sub">Targets: Google Scholar, DOI pages, journal sites, arXiv, PubMed, repositories. Backend must be running (./run.ps1).</div>
  <div class="row">
    <label>DOI (optional — auto-detected from the page if blank)</label>
    <input id="doi" placeholder="10.1234/example" />
  </div>
  <div class="row">
    <label>Title</label>
    <input id="title" />
  </div>
  <button id="save">Save to Local Workbench</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
